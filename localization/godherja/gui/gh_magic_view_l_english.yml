  spawn_wild_leshens_army_name:0 "Summon Leshens"
 spawn_wild_leshens_army_desc:0 "Leshens"
 spawn_wild_leshens_armies_name:0 "Summoning Leshens"
 spawn_wild_leshens_armies_desc:0 "Extremely territorial and aggressive masses of plant matter animated by a powerful spirit, leshens manifest with regularity only in the most heavily wooded regions of [aeras|E]. Though their nexus might not be much larger than a person, their malleable form means that the most ancient of leshens have been known to grow as large as an oak tree when accounting for their limbs and other protrusions. Known to blend seamlessly into the deep woods they protect, Leshens can command the beasts and plants of the forest and summon crows, wolves, and even the very trees to do their bidding. Whispered legends speak of their ability to manipulate shadows and disappear into the foliage, making them nearly impossible to track or escape once provoked. Encountering a Leshen is a rare and perilous event, one that few survive to recount."
 

 spawn_night_gaunts_name:0 "Nightgaunts"
 spawn_night_gaunts_desc:0 "Summon Night Gaunts"
 spawn_night_gaunts_army_name:0 "Nightgaunts"
 spawn_night_gaunts_army_desc:0 "There exist words of ancient blasphemy that, when repeated enough, may attract the attention of one of the Redlands' many vile denizens - the Nightgaunts. Though most dangerous to recite when in their natural habitat, this incantation has been known to summon them even to other continents. When uttered by priests, the phrase is thought to especially enrage the creatures.\n\n Normally, the black-winged swarm will descend upon the speaker, feast upon them and any hapless bystanders, and retreat back to their shadowy home. However, it has been noted that certain potions of domination are extraordinarily potent against these monsters, even proving effective when merely present in one of their victims' bloodstreams."
 

 spawn_woodland_hydra_name:0 "Woodland Hydra"
 spawn_woodland_hydra_desc:0 "Summon Woodland Hydra"
 spawn_woodland_hydra_army_name:0 "Woodland Hydra"
 spawn_woodland_hydra_army_desc:0 "The Woodland Hydra is a monstrous, fanged, serpentine amphibious beast native to the dark forests, marshes and wetlands of [aeras|E]. It is popularly believed that the beast grows two heads for every head that is removed, when in fact this is not the case. Rather, Hydra are typically born with anywhere from three to twelve heads and the more heads a Hydra has, the more dangerous it is. However, incessant infighting among Hydras means that most chew their way to death before even reaching puberty. As a result of the perpetual infighting, most of the hydra that survive tend to prefer an ambush-and-hunt style to any kind of direct confrontation whenever the opportunity presents itself."

 spawn_seraph_melacham_name:0 "Melacham"
 spawn_seraph_melacham_desc:0 "Summon Melacham"
 spawn_seraph_melacham_army_name:0 "Melacham"
 spawn_seraph_melacham_army_desc:0 "Melacham are powerful winged celestial warriors rumored to wield the might of a thousand suns in battle. Fighting alongside Melacham has its benefits as their prowess in battle is unmatched, and their very presence emits a cleansing and purifying aura that emboldens allied soldiers and strikes fear into the hearts of evildoers. Melacham are particularly effective at fighting undead or dark beings and often make it their mission to do battle with evil and purge it from every corner of [aeras|E]."

