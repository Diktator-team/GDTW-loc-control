 spawn_water_elementals_desc:0 "Summon Water Elementals"
 spawn_water_elementals_army_name:0 "Water Elementals"
 spawn_water_elementals_army_desc:0 "[aspect_water] Elementals are formidable creatures that often manifest themselves in the form of a wave or a similar fluid, ever-changing shape. Given their ability to harness the full might of any nearby body of water, these elementals can have a massive impact on the longevity of civilizations and empires and are just as likely to nourish a kingdom's crops as they are likely to wipe it off of the face of the map."

 spawn_stone_elementals_name:0 "Stone Elementals"
 spawn_stone_elementals_desc:0 "Summon Stone Elementals"
 spawn_stone_elementals_army_name:0 "Stone Elementals"
 spawn_stone_elementals_army_desc:0 "Although these gargantuan creatures are among the slowest of the different elemental varieties, their lack of agility and speed is made up for by their sheer strength and their ability to single-handedly turn the tide of wars or sieges in an instant. These elementals thrive in drier and rockier environments and are often used as siege weapons since they are capable of reducing entire walls and towers to heaps of rubble with the swing of a single arm. Outside of combat, magi often use [aspect_stone] Elementals as a form of construction labor."

 spawn_air_elementals_name:0 "Air Elementals"
 spawn_air_elementals_desc:0 "Summon Air Elementals"
 spawn_air_elementals_army_name:0 "Air Elementals"
 spawn_air_elementals_army_desc:0 "Often thought of as the least dangerous of all the elementals, [aspect_air] Elementals are known for being whimsical instruments of mayhem that take as much delight in returning a baby bird to its nest as they do in conjuring massive cyclones of devastation."

 spawn_fire_elementals_name:0 "Fire Elementals"
 spawn_fire_elementals_desc:0 "Summon Fire Elementals"
 spawn_fire_elementals_army_name:0 "Fire Elementals"
 spawn_fire_elementals_army_desc:0 "These elementals are the embodiment of fire itself, often manifesting as callous infernos of destruction and carving out charred and scorched paths of earth in their wake as they incinerate all who stand in their path."

 spawn_ice_elementals_name:0 "Ice Elementals"
 spawn_ice_elementals_desc:0 "Summon Ice Elementals"
 spawn_ice_elementals_army_name:0 "Ice Elementals"
 spawn_ice_elementals_army_desc:0 "Often thought of as the physical manifestations of winter itself, these giant crystalline beings are most potent in icy or wintery conditions where they can freeze and shatter those foolish enough to confront them in battle with a single breath or touch."

 spawn_nature_elementals_name:0 "Nature Elementals"
 spawn_nature_elementals_desc:0 "Summon Nature Elementals"
 spawn_nature_elementals_army_name:0 "Nature Elementals"
 spawn_nature_elementals_army_desc:0 "Nature Elementals often appear as an ever-shifting mix of roots, vines, branches, and other natural materials native to the dense forests and jungles of [aeras|E]. These elementals are imbued with an unrelenting vigor that encapsulates the very essence of the natural world—that is, the emergence of life from that which is lifeless. Similar to other elementals, [aspect_nature] Elementals can be quite temperamental and are just as likely to restore life to a dying field or grove as they are to wreak havoc when provoked."

 spawn_metal_elementals_name:0 "Metal Elementals"
 spawn_metal_elementals_desc:0 "Summon Metal Elementals"
 spawn_metal_elementals_army_name:0 "Metal Elementals"
 spawn_metal_elementals_army_desc:0 "Metal elementals are made from a combination of solid ore and minerals such as diamond and platinum found deep within the earth and heated at extreme temperatures. These elementals possess a thick steel-like exterior casing that makes them impervious to ordinary armaments such as spears or arrows. This particular characteristic makes [aspect_metal] Elementals especially dangerous in combat, and it can sometimes take multiple enemy regiments with the help of several magi to subdue a Metal Elemental in combat. Metal Elementals can also be used as exceptionally efficient siege weaponry and have been known to level entire structures with just a few powerful strikes."

 spawn_sand_elementals_name:0 "Sand Elementals"
 spawn_sand_elementals_desc:0 "Summon Sand Elementals"
 spawn_sand_elementals_army_name:0 "Sand Elementals"
 spawn_sand_elementals_army_desc:0 "Formed from the swirling sands and ever-shifting dunes of [aeras|E], [aspect_sand] Elementals typically appear as formless, ever-shifting amalgamations of differently colored layers of sand. The handful of travelers who have survived encounters with these elementals describe seeing lucid beams of light shimmering and rippling in the desert heat, creating a bright, almost sparkling façade that masks the true nature of one of the apex predators of the desert ecosystem. Sand Elementals are incredibly adaptative and can rearrange the fibers of their corporeal bodily composition to dodge projectiles and traditional military munitions, making them incredibly deadly in battle and very difficult to subdue or kill."

 spawn_light_elementals_name:0 "Light Elementals"
 spawn_light_elementals_desc:0 "Summon Light Elementals"
 spawn_light_elementals_army_name:0 "Light Elementals"
 spawn_light_elementals_army_desc:0 "Formed from the brilliance of the sun's rays, these elementals radiate a cleansing and purifying light that is said to touch even the darkest crevices of [aeras|E]. Throughout history, many cultures and faiths have traditionally associated the aspect of light with divinity, morality, and order. [aspect_light] Elementals are particularly effective at neutralizing creatures imbued with [aspect_dark] magic, as well as Undead units and other products of necromancy."

 spawn_blood_elementals_name:0 "Blood Elementals"
 spawn_blood_elementals_desc:0 "Summon Blood Elementals"
 spawn_blood_elementals_army_name:0 "Blood Elementals"
 spawn_blood_elementals_army_desc:0 "The rituals for summoning Blood Elementals are thought to have been lost to time, but historical records suggest that proficient Living magi used to conduct a series of gruesome and unholy sacrificial rituals to summon these elementals. Historical records indicate that human sacrifices often produced the best results. Thus, practitioners of [aspect_blood] magic would often sacrifice peasants, prisoners of war, and slaves to fulfill their sanguine pursuits."

 spawn_death_elementals_name:0 "Death Elementals"
 spawn_death_elementals_desc:0 "Summon Death Elementals"
 spawn_death_elementals_army_name:0 "Death Elementals"
 spawn_death_elementals_army_desc:0 "Very little is known about [aspect_death] Elementals since very few people have ever survived an encounter with one. However, based on the few existing historical accounts of Death Elementals which still exist, Magi and scholars alike agree that only the strongest Magi or Liches are powerful enough to actually control these beings, and that their very touch or breath is enough to kill the strongest warrior."

 spawn_dark_elementals_name:0 "Dark Elementals"
 spawn_dark_elementals_desc:0 "Summon Dark Elementals"
 spawn_dark_elementals_army_name:0 "Dark Elementals"
 spawn_dark_elementals_army_desc:0 "Sometimes referred to as Shadelings, [aspect_dark] Elementals are extremely dangerous creatures who dwell in the darkest corners of [aeras|E], lulling unsuspecting victims to their doom. Ancient Redlander texts are rumored to describe the presence of a Dark Elemental as one that fills even the strongest magi with fear."

 spawn_ethereal_elementals_name:0 "Ethereal Elementals"
 spawn_ethereal_elementals_desc:0 "Summon Ethereal Elementals"
 spawn_ethereal_elementals_army_name:0 "Ethereal Elementals"
 spawn_ethereal_elementals_army_desc:0 "[aspect_ethereal] Elementals are a particularly strong Elemental subtype that can exert a great deal of influence over peoples' psyche, mind, and judgment. To date, magi and scholars have not been able to produce a unified accounting of exactly what Ethereal Elementals are capable of, but first-hand accounts from those who have encountered these beings suggest that they can induce a series of visions or hallucinations. Some individuals have described witnessing scenes involving mysterious beings in ancient armor, hearing sounds of an old battle that took place centuries ago, or unlocking memories that had been hidden away, deep within the person's subconscious."

 spawn_celestial_elementals_name:0 "Celestial Elementals"
 spawn_celestial_elementals_desc:0 "Summon Celestial Elementals"
 spawn_celestial_elementals_army_name:0 "Celestial Elementals"
 spawn_celestial_elementals_army_desc:0 "[aspect_celestial]Elementals are a physical manifestation of the power of the cosmos and creation itself. On the battlefield, these Elementals can draw upon the celestial bodies in the heavens to produce incredibly powerful blasts of energy that have been known to destroy armies and leave even the mightiest of citadels in ruins. However, confirmed historical references of them are scarce with many magi and scholars believing that the spell for summoning these mighty beings was lost in the aftermath of [frodbrokna|E]. The few written accounts that do still exist all describe witnessing a nebulous, vaguely humanoid form with piercing white eyes gliding across the battlefield and laying ruin to enemy troops."

 spawn_dream_elementals_name:0 "Dream Elementals"
 spawn_dream_elementals_desc:0 "Summon Dream Elementals"
 spawn_dream_elementals_army_name:0 "Dream Elementals"
 spawn_dream_elementals_army_desc:0 "[aspect_dream] Elementals are the ethereal embodiments of the subconscious given form. Whether they know it or not, all creatures on [aeras|E] interact with Dream Elementals every time they fall asleep. Dream Elementals are known for being especially fickle and temperamental. Magi and scholars alike cite multiple cases where it is believed that Dream Elementals have a penchant for whimsically deciding whether or not to plague someone with horrific nightmares that drives them insane and eventually to their death, or whether that same person should instead be graced with a series of pleasant dreams that may contain clues about the future."

 spawn_lightning_elementals_name:0 "Lightning Elementals"
 spawn_lightning_elementals_desc:0 "Summon Lightning Elementals"
 spawn_lightning_elementals_army_name:0 "Lightning Elementals"
 spawn_lightning_elementals_army_desc:0 "These deadly beings are a living embodiment of [aspect_fire] and [aspect_air] fused together. When provoked, these Elementals are capable of unleashing the destructive fury of the storm against all who stand in their way."

 spawn_quicksilver_elementals_name:0 "Quicksilver Elementals"
 spawn_quicksilver_elementals_desc:0 "Summon Quicksilver Elementals"
 spawn_quicksilver_elementals_army_name:0 "Quicksilver Elementals"
 spawn_quicksilver_elementals_army_desc:0 "Quicksilver Elementals are the constantly shifting physical manifestations of liquid metal. Impossible to catch or contain, Quicksilver Elementals are well suited for reconnaissance missions due to their ability to evade detection and slip away at a moment's notice. On the battlefield, they can weave back and forth at incredible speed, allowing them to evade most mundane attacks and munitions."

 spawn_desert_mirage_elementals_name:0 "Desert Mirage Elementals"
 spawn_desert_mirage_elementals_desc:0 "Summon Desert Mirage Elementals"
 spawn_desert_mirage_elementals_army_name:0 "Desert Mirage Elementals"
 spawn_desert_mirage_elementals_army_desc:0 "Formed from the combination of desert heat and shifting sands, these elementals are notorious for deceiving and disorienting weary travelers with illusions of lush oases that turn out to be nothing more than barren grottos."

 spawn_dune_reaper_elementals_name:0 "Dune Reaper Elementals"
 spawn_dune_reaper_elementals_desc:0 "Summon Dune Reaper Elementals"
 spawn_dune_reaper_elementals_army_name:0 "Dune Reaper Elementals" 
 spawn_dune_reaper_elementals_army_desc:0 "These eerie creatures often appear as swirling vortexes of [aspect_sand]. Their arrival is always followed by the putrid smell of the [aspect_death] and decay of the poor souls who have been consigned to unmarked graves amongst the vast expanses of the desert sands of [aeras|E]."

 spawn_mountain_spirit_elementals_name:0 "Mountain Spirit Elementals"
 spawn_mountain_spirit_elementals_desc:0 "Summon Mountain Spirit Elementals"
 spawn_mountain_spirit_elementals_army_name:0 "Mountain Spirit Elementals"
 spawn_mountain_spirit_elementals_army_desc:0 "Mountain Spirit Elementals typically reside amongst the jagged peaks of Aeras' many mountain ranges but have been known to venture down into heavily forested or hilly terrain on occasion. Superstitious travelers and adventurers will often leave small offerings as they trek through the mountain passes so as to appease these elementals for fear of becoming the target of boulder avalanches.""


 imbued_armor_name:0 "Strength Armor"
 imbued_armor_desc:0 "The armor of the heavy infantry is enhanced and has an increased resistence and density. This has the downside of a slower movement over long distances, but in battle the magi will supply the enhancements with magic, making them fight even better."
 
 erase_mental_trauma_name:0 "Erase Mental Trauma"
 remove_depression_name:0 "Remove Depression"
 remove_depression_desc:0 "Using [aspect_dark] magic, the memory causing depression is erased for a cost"
 
 dark_raid_name:0 "Dark Raid"
 increase_raid_speed_dark_name:0 "Hastened Raiders"
 increase_raid_speed_dark_desc:0 "Raider destruction is enhanced with the help of [aspect_dark] magic."
 
 increase_raid_capture_improvement_name:0 "Easier Raid Prisoner Capture"
 increase_raid_capture_improvement_desc:0 "The shadows make it easy to find those hiding in the dark. Increased chance of capturing prisoners after a raid."

 sundeath_desc:0 "As the Voidgods order, use the Abyssal Prism to finally snuff out the sun."

 frozen_visage_name:0 "Slow to Change"
 frozen_visage_desc:0 "Using [aspect_ice] magic has the side effect of causing the caster to become more static in life, they find it harder to learn, or relax or get stressed."
 
 magic_frozen_experience:0 "Frozen Mind"
 magic_frozen_experience_name:0 "Frozen Mind"
 magic_frozen_experience_desc:0 "[aspect_ice] magic caused [ROOT.Char.GetFirstName] to become more static in life, they find it harder to learn, or relax or get stressed."

 frozen_decay_name:0 "Frozen Decay"
 frozen_decay_desc:0 "This spell freezes the recipient's physical age in place ensuring they do not lose their body's strength as long as it lasts. However, it has noticeably lowered their body temperature making them more susceptible to disease."
 
 add_character_modifier_iced_prowess_name:0 "Static Body"
 add_character_modifier_iced_prowess_desc:0 "Spell freezes the recipient's physical age ensuring they do not lose their body's strength as long as it lasts."


 birth_boon_name:0 "Newborn Stat Gain"
 birth_boon_desc:0 "Upon giving birth, the target's newborn will be given extra base stats permanently. Newborns will also have chance to gain positive stats."
 add_character_modifier_magic_significantly_drained_single_stack_name:0 "Permanent Skill Loss"
 add_character_modifier_magic_significantly_drained_single_stack_desc:0 "Causes permanent loss of all [skills|E] and [health|E]."
 death_on_childbirth_chance_name:0 "Dangerous Childbirth"
 death_on_childbirth_chance_desc:0 "Increased chances of both mother and child perishing after birth."
 
 wound_curse_name:0 "Wounding Curse"
 wound_curse_desc:0 "Target will, over a period of several years, gradually accrue wounds, become maimed and ultimately die."
 curse_name:0 "Curse"
 curse_desc:0 "Effects cannot be lifted unless under very specific conditions."
 return_to_sender_name:0 "Return to Sender"
 return_to_sender_desc:0 "If the long-term effects of the spell are not allowed to reach their conclusion, they will transfer back to the caster."
 
 blood_conduit_name:0 "Blood Conduit"
 blood_conduit_desc:0 "Any harmful or beneficial events that happen to the target have a chance of also affecting direct blood relations. Chances are massively increased if the other family member is also a blood conduit."
 
 protector_spirit_name:0 "Protector Spirit"
 protector_spirit_desc:0 "When the target is seriously harmed, a spirit will spawn to challenge the instigator to a to-the-death duel. This will happen only once."
 
 spawn_stone_mount_name:0 "Steed of Stone"
 spawn_stone_mount_desc:0 "Gives a facsimile of life to the stone, creating #E Stone Golem#! as an [artifact|E] with quality dependent on the level at which the spell was cast."

 add_character_modifier_travel_advantage_name:0 "Fleet-footed"
 add_character_modifier_travel_advantage_desc:0 "Increases the target character's travel speed."

 add_character_modifier_travel_disadvantage_name:0 "Slowed"
 add_character_modifier_travel_disadvantage_desc:0 "Decreases the target character's travel speed."

 add_character_modifier_magic_general_opinion_name:0 "Refreshing Presence"
 add_character_modifier_magic_general_opinion_desc:0 "This character's countenance has been improved through magical means."

 add_character_modifier_magic_attraction_opinion_name:0 "Alluring Presence"
 add_character_modifier_magic_attraction_opinion_desc:0 "This character has been made more attractive to others through magical means."

 add_character_modifier_magic_realm_opinion_name:0 "Inspiring Presence"
 add_character_modifier_magic_realm_opinion_desc:0 "Magic has resulted in this character being held as a paragon by those around them."

 add_character_modifier_light_of_ohrasik_name:0 "Light of Ohrasik"
 add_character_modifier_light_of_ohrasik_desc:0 "Gain faith hostility advantage and same faith opinion."
 add_character_modifier_religious_fanaticism_name:0 "Religious Fanaticism"
 add_character_modifier_religious_fanaticism_desc:0 "Reduce opinion of other faiths and lower learning."


 random_stat_increase_name:0 "Skill Increase"
 random_stat_increase_desc:0 "Certain [skills|E] may be permanently improved."
 
 learn_arcane_knowledge_name:0 "Learn Arcane Knowledge"
 learn_arcane_knowledge_desc:0 "May learn a random [ritual|E] or increase a relevant [aspect|E] skill."
 learn_random_spell_desc:0 "Learn a random [ritual|E]."

 add_character_modifier_magic_defiled_nadir_modifier_name:0 "One with the Mask"
 add_character_modifier_magic_defiled_nadir_modifier_desc:0 "Delay aging through binding your lifeforce to your mask."

# Effect Tags (County Modifiers)
 add_county_modifier_magic_fallout_modifier_name:0 "Magical Fallout"
 add_county_modifier_magic_fallout_modifier_desc:0 "Leaves an area with a significant long-term increase in ambient [magic|E]."

 add_county_modifier_defensive_county_magic_name:"Defensive Battle Magic"
 add_county_modifier_defensive_county_magic_desc:0 "Strengthens the [garrison|E] in the target [county|E]."

 add_county_modifier_fort_creation_name:"Improve Fortifications"
 add_county_modifier_fort_creation_desc:0 "Improves the fortifications of the target [county|E] for a few years."

 add_county_modifier_fort_creation_long_term_name:"Raise Fortress"
 add_county_modifier_fort_creation_long_term_desc:0 "Improves the fortifications of the target for decades."

 add_county_modifier_building_construction_name:"Building Construction"
 add_county_modifier_building_construction_desc:0 "Decreases #E Build Speed#! and #E Build Cost#! in the target of this spell for around a decade."

 add_county_modifier_improve_agriculture_name:"Improve Agriculture"
 add_county_modifier_improve_agriculture_desc:0 "Improves [development|E] #E Growth#!, #E Tax#! and #E Supply Limit#!."

 add_county_modifier_resource_exotic_metals_modifier_name:0 "Create Small Exotic Metal Vein"
 add_county_modifier_resource_exotic_metals_modifier_desc:0 "Creates a small vein of exotic metal that is likely to be exhausted within a few decades."

 add_county_modifier_resource_exotic_metals_modifier_permanent_name:0 "Create Exotic Metal Deposit"
 add_county_modifier_resource_exotic_metals_modifier_permanent_desc:0 "Creates a large deposit of exotic metal that will effectively never be exhausted."

 add_county_modifier_resource_abundant_stone_modifier_name:0 "Create Supply of Stone"
 add_county_modifier_resource_abundant_stone_modifier_desc:0 "Creates a supply of high-quality stone that will likely be exhausted within a decade."

 add_county_modifier_resource_abundant_stone_modifier_long_term_name:0 "Create Large Supply of Stone"
 add_county_modifier_resource_abundant_stone_modifier_long_term_desc:0 "Creates a large supply of high-quality stone that will not be exhausted within a century."

 add_county_modifier_resource_excellent_soil_name:0 "Improve Soil"
 add_county_modifier_resource_excellent_soil_desc:0 "Improves the soil of the target of this spell, rendering it more fertile for quite a while."

 add_county_modifier_resource_verdant_plant_growth_name:0 "Verdant Growth"
 add_county_modifier_resource_verdant_plant_growth_desc:0 "Improves plant growth in the target area of this spell, causing all plantlife to grow at a truly extraordinary speed."

 add_county_modifier_magic_destroyed_buildings_name:0 "Devastate Constructions"
 add_county_modifier_magic_destroyed_buildings_desc:0 "Causes widespread urban devastation, increasing #E Build Speed#! and #E Build Cost#! of buildings built in the target county."

 add_county_modifier_magic_ruined_agriculture_name:0 "Destroy Harvest"
 add_county_modifier_magic_ruined_agriculture_desc:0 "Ruins agricultural production in the target [county|E], decreasing  [development|E] #E Growth#!, #E Tax#! and #E Supply Limit#!."

 add_county_modifier_gold_income_mult_negative_name:0 "Weaken Economy"
 add_county_modifier_gold_income_mult_negative_desc:0 "Weakens the economy in the target [county|E], decreasing #E Tax#!."

 add_county_modifier_defender_advantage_name:0 "Increase Defender Advantage"
 add_county_modifier_defender_advantage_desc:0 "Increases defender [advantage|E] in the target [county|E]."
 
 county_lower_control_modifier:0 "Reduce Control"
 county_lower_control_modifier_desc:0 "The region has begun to lose control as a result of the spell."
 county_lower_control_modifier_livestock:0 "Rampaging Creatures"
 county_lower_control_modifier_livestock_desc:0 "[magic|E] has inflamed the passions of this area's livestock, increasing their energy and boosting fertility."

 add_county_modifier_cease_growth:0 "Cease Growth"
 add_county_modifier_cease_growth_desc:0 "Large amounts of [aspect_light] magic has made it harder to develop the province."
 reduce_growth_magic_modifier:0 "Cease Growth"
 reduce_growth_magic_modifier_desc:0 "Development of the province is slowed by magic."

 add_county_modifier_illuminated_night_name:0 "Illuminated Night"
 add_county_modifier_illuminated_night_desc:0 "Imrpoves [control|E], [county_opinion|E], defender [advantage|E] and county [tax|E]."
 add_county_modifier_light_pollution_name:0 "Light Pollution"
 add_county_modifier_light_pollution_desc:0 "Decreases [county_opinion|E] and [supply|E]"

# Effect Tags (County Effects)
 gain_arcane_fallout_name:0 "Arcane Fallout"
 gain_arcane_fallout_desc:0 "Increases ambient [magic|E], causing the target [county|E] to become increasingly hostile to mundane life."
 gain_lichdom_sorrow_name:0 "Sorrowing"
 gain_lichdom_sorrow_desc:0 "Drains [magic|E] and life from the land, causing the target [county|E] to become increasingly hostile to life itself."
 gain_arcane_desert_name:0 "Arcane Sands"
 gain_arcane_desert_desc:0 "Seeps the earth completely dry, causing the target [county|E] to experience desertification."
 gain_frozen_wasteland_name:0 "Arcane Frost"
 gain_frozen_wasteland_desc:0 "Freezes the ground and all that walks upon it, turning a [county|E] into a frozen wasteland."
 reduce_development_name:0 "Reduce Development"
 reduce_development_desc:0 "Causes devastation and reduces [development|E] in the target [county]."
 summon_fog_name:0 "Summon the [fog|E]"
 summon_fog_desc:0 "Brings forth the horrifying [fog|E] into the target [county|E], gradually overwhelming it."
 add_county_modifier_drought_name:0 "Drought"
 add_county_modifier_drought_desc:0 "Ruins agricultural production in the target [county|E]."
 reduce_agriculture_magic_modifier:0 "Drought-Causing Magic"
# Effect Tags (Province Modifiers)
 add_province_modifier_magic_shattered_defenses_name:0 "Shatters Defenses"
 add_province_modifier_magic_shattered_defenses_desc:0 "Causes a [holding|E]'s fort level to degrade."
 
 restore_kemsar_name:0 "Restore the Dead River"
 restore_kemsar_desc:0 "Brings water back to kemsar's lands, changing the [terrain|E] and raising [development|E]."
 kemsar_restores_terrain:0 "Changes the [terrain|E] from Arid, raising water levels and bringing more temperate ecology."
 kemsar_restores_counties:0 "Raises the [development|E] of every [county|E] within Kemsar."
 destroy_sun_name:0 "Extinguish the Sun"
 destroy_sun_desc:0 "Causes the Sun to cool off and die over the span of several years, causing a worldwide apocalypse of unprecedented proportions"
# Non-Effect Tags
 requires_target_deceased_parent_name:0 "Fallen Progenitor"
 requires_target_deceased_parent_desc:0 "Can only be casted on targets that have at least one deceased parent."
 requires_target_pregnant_name:0 "Requires Pregnancy"
 requires_target_pregnant_desc:0 "Target must be [GetTrait('pregnant').GetName( GetNullCharacter )]"
 
 #kill_switch_name:0 "Kill Switch"
 #kill_switch_desc:0 "Effects only activate when the target dies."

# Stress Tags
 hex_name:89 "Hex"
 hex_desc:89 "This [ritual|E] is a Hex; it does not generally cause any immediately visible effects and cannot be detected or resisted upon casting. Its full effects, however, are only activated when a certain condition is fulfilled, at which point the victim may be able to resist or detect the [ritual|E]'s origin."
 increase_stress_name:0 "Increase Stress"
 increase_stress_desc:0 "Increases [stress|E]."
 sadistic_effects_name:0 "Cruel Effects"
 sadistic_effects_desc:0 "Has particularly cruel and inhumane effects — some [traits|E] will be impacted by [stress|E] effects upon casting."
 increase_stress_pain_name:0 "Painful Experience"
 increase_stress_pain_desc:0 "Undergoing this spell is extremely physically painful — will incur [stress|E] upon casting."
 
####################
# SPELL COMPONENTS #
####################
 
 runic_scroll_spell_component_name:0 "Runic Scroll"
 runic_scroll_spell_component_desc:0 "The physical presence of a ritual's [Concept('runic_script','runic form')|E] is a potent amplifier of its power."
 prism_spell_component_name:0 "Mana Prism"
 prism_spell_component_desc:0 "A Mana Prism is required for storing the arcane energies released in this ritual."
 pay_gold_name:0 "Invest [gold_i][gold|E]"
 pay_gold_desc:0 "Various odds and ends, not individually particularly valuable, but still adding up to an appreciable price when combined."
 pay_wounds_name:0 "Sacrifice Blood"
 pay_wounds_desc:0 "The spell demands a sacrifice of your own blood, and in such an amount as to require considerable wounds to obtain."
 character_prisoner_name:0 "Provide [prisoner|E]"
 character_prisoner_desc:0 "The assistance of an unwilling subject is required — the role they serve is unlikely to be pleasant."
 character_cabal_name:0 "Perform Rite"
 character_cabal_desc:0 "A complex and possibly lengthy process, preferably to be performed by someone with the right experience."
 character_herbalist_blood_draining_poultice_name:0 "Produce Blood-Draining Poultice"
 character_herbalist_blood_draining_poultice_desc:0 "It is possible to significantly enhance the process of draining blood by using certain poultices, though producing them will require good knowledge of local herbs and their alchemical properties."
 artifact_spell_component_name:0 "Provide [artifact|E]"
 artifact_spell_component_desc:0 "A tool or ingredient that might not be of everyday nature, or easy to acquire."
 sacrificial_dagger_spell_component_name:0 "Provide Sacrificial Dagger"
 sacrificial_dagger_spell_component_desc:0 "A regular blade might simply not have the finesse for this task — one etched with the proper runes and imbued with the right magical energies is necessary."
 bone_spell_component_name:0 "Provide Bones"
 bone_spell_component_desc:0 "Bones can be powerful sources of energy, though it is not guaranteed."
 essence_spell_component_name:0 "Provide Elemental Essence"
