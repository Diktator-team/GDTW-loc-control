 game_concept_anohelis_outcasts:90 "Anohêlis Outcasts"
 game_concept_anohelis_outcasts_desc:90 "Anohêlis—or the Marked Ones in the Sarminian tongue—are a caste of exiles and criminals whose status as freewomen or Órzopajas has been stripped from them for severe crimes, treason, betrayal, or cowardice. As punishment, their heads are shaven clean and scalps seared with branding irons so that no hair can grow for decades or more, and very poorly thereafter. Stigmatized and banished from their communities, they are forbidden from returning under the threat of execution—although for many, it is already a fate worse than death."
 
